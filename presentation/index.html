<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RxAI Memory Retrieval</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#f2a33a; --accent2:#4fb6c9; }
  * { box-sizing:border-box; margin:0; }
  html { background:var(--bg); }
  html, body { height:100%; color:var(--text); font:18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #deck { height:100vh; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; }
  section { height:100vh; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:center;
            padding:6vh 8vw; gap:3vh; }
  h1 { font-size:clamp(2.4rem, 6vw, 4.6rem); line-height:1.05; letter-spacing:-.02em; }
  h2 { font-size:clamp(1.6rem, 3.4vw, 2.6rem); letter-spacing:-.01em; }
  h2 small, .kicker { display:block; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:.4em; }
  .sub { font-size:1.3rem; color:var(--dim); max-width:46ch; }
  .meta { color:var(--dim); font-size:.95rem; }
  .grid { display:grid; gap:1.2rem; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.3rem; }
  .card b { display:block; color:var(--accent2); margin-bottom:.25em; }
  .stat { font-size:2.6rem; font-weight:700; color:var(--accent); line-height:1; }
  .types { display:grid; grid-template-columns:auto 1fr; gap:.4rem 1.4rem; }
  .types code { color:var(--accent2); font-size:.95rem; }
  ol.steps { list-style:none; counter-reset:s; display:grid; gap:.8rem; max-width:52ch; }
  ol.steps li { counter-increment:s; display:flex; gap:1rem; align-items:baseline; }
  ol.steps li::before { content:counter(s); flex:none; width:2rem; height:2rem; border-radius:50%; display:grid; place-items:center;
                        background:var(--panel); border:1px solid var(--accent); color:var(--accent); font-weight:700; }
  pre { background:rgba(22,27,34,.85); border:1px solid var(--line); border-radius:12px; padding:1.2rem 1.4rem; font-size:1rem; line-height:1.9; white-space:pre-wrap; color:var(--accent2); }
  .note { border-left:3px solid var(--accent); padding-left:1rem; color:var(--dim); }
  svg { width:100%; height:auto; max-height:60vh; }
  svg text { fill:var(--text); font-family:inherit; }
  #nav { position:fixed; right:1.2rem; bottom:1rem; color:var(--dim); font-size:.85rem; }
  #bar { position:fixed; left:0; top:0; height:3px; background:var(--accent); transition:width .2s; }
  #gl { position:fixed; inset:0; width:100%; height:100%; z-index:-1; }
  .card { background:rgba(22,27,34,.82); backdrop-filter:blur(6px); }
  /* slide content rises in when its slide arrives (transform/opacity only: GPU-composited) */
  section > * { opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  section.in > * { opacity:1; transform:none; }
  section.in > :nth-child(2) { transition-delay:.12s; } section.in > :nth-child(3) { transition-delay:.24s; }
  @media (prefers-reduced-motion:reduce) { section > * { transition:none; opacity:1; transform:none; } }
  @media print { #deck { height:auto; overflow:visible; } section { page-break-after:always; } section > * { opacity:1; transform:none; } #nav, #bar, #gl { display:none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"></div>
<main id="deck"></main>
<div id="nav"></div>
<script src="data.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const cards = rows => `<div class="grid">${rows.map(([t, d]) => `<div class="card"><b>${esc(t)}</b>${esc(d)}</div>`).join("")}</div>`;
const pct = v => v == null ? "pending" : `${Math.round(v * 100)}%`;
const wrap = (text, n) => text.split(" ").reduce((ls, w) => ((ls.at(-1) + " " + w).trim().length > n ? ls.push(w) : ls[ls.length - 1] = (ls.at(-1) + " " + w).trim(), ls), [""]);

// Pipeline: one box per stage with arrows between; SVG so it scales to any screen.
function pipelineSvg(stages) {
  const w = 210, h = 136, gap = 40, W = stages.length * (w + gap) - gap;
  const boxes = stages.map((s, i) => {
    const x = i * (w + gap), hl = s.name === "Reactor";
    return `<rect x="${x}" y="0" width="${w}" height="${h}" rx="12" fill="${hl ? "#2a1f0d" : "#161b22"}" stroke="${hl ? "#f2a33a" : "#4fb6c9"}" stroke-width="1.5"/>
      <text x="${x + w / 2}" y="32" text-anchor="middle" font-size="20" font-weight="700">${esc(s.name)}</text>
      ${wrap(s.detail, 26).map((l, j) => `<text x="${x + w / 2}" y="${60 + j * 18}" text-anchor="middle" font-size="13" style="fill:#8b949e">${esc(l)}</text>`).join("")}
      ${i < stages.length - 1 ? `<path d="M${x + w + 6} ${h / 2} h${gap - 14}" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>` : ""}`;
  }).join("");
  return `<svg viewBox="-4 -4 ${W + 8} ${h + 8}" role="img" aria-label="Pipeline: ${esc(stages.map(s => s.name).join(", "))}">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>${boxes}</svg>`;
}

// Horizontal bars on 0..1; a null value draws a dashed "pending" outline.
function barsSvg(rows) {
  const lw = 340, bw = 520, rh = 46;
  return `<svg viewBox="0 0 ${lw + bw + 80} ${rows.length * rh}" role="img" aria-label="Results">${rows.map((r, i) => {
    const y = i * rh, len = (r.value ?? 0) * bw, pending = r.value == null;
    const bar = pending
      ? `<rect x="${lw}" y="${y + 8}" width="${bw}" height="26" rx="6" fill="none" stroke="#30363d" stroke-dasharray="6 5"/>`
      : `<rect x="${lw}" y="${y + 8}" width="${bw}" height="26" rx="6" fill="#161b22"/><rect x="${lw}" y="${y + 8}" width="${len}" height="26" rx="6" fill="#f2a33a"/>`;
    return `<text x="${lw - 14}" y="${y + 27}" text-anchor="end" font-size="15">${esc(r.label)}</text>${bar}
      <text x="${pending ? lw + bw / 2 : lw + len + 10}" y="${y + 27}" font-size="15" font-weight="700" ${pending ? 'text-anchor="middle" style="fill:#8b949e"' : ""}>${pct(r.value)}</text>`;
  }).join("")}</svg>`;
}

// Two bars per row (a over b) on a shared scale; names label the pair.
function pairSvg(rows, names, max = 1) {
  const lw = 230, bw = 520, rh = 64;
  return `<svg viewBox="0 0 ${lw + bw + 190} ${rows.length * rh}" role="img" aria-label="${esc(names.join(" vs "))}">${rows.map((r, i) => {
    const y = i * rh, a = r.a / max * bw, b = r.b / max * bw;
    return `<text x="${lw - 14}" y="${y + 33}" text-anchor="end" font-size="15">${esc(r.label)}</text>
      <rect x="${lw}" y="${y + 6}" width="${a}" height="22" rx="5" fill="#30363d"/><text x="${lw + a + 8}" y="${y + 23}" font-size="13" style="fill:#8b949e">${esc(names[0])} ${r.a.toFixed(3)}</text>
      <rect x="${lw}" y="${y + 32}" width="${b}" height="22" rx="5" fill="#4fb6c9"/><text x="${lw + b + 8}" y="${y + 49}" font-size="13" font-weight="700">${esc(names[1])} ${r.b.toFixed(3)}</text>`;
  }).join("")}</svg>`;
}

const D = DECK;
const stats = rows => `<div class="grid">${rows.map(s => `<div class="card"><div class="stat">${esc(s.value)}</div>${esc(s.label)}</div>`).join("")}</div>`;
const steps = rows => `<ol class="steps">${rows.map(r => `<li>${esc(r)}</li>`).join("")}</ol>`;
const slides = [
  `<span class="kicker">${esc(D.event)}</span><h1>${esc(D.title)}</h1><p class="sub">${esc(D.subtitle)}</p>
   <p class="meta">${esc(D.team.join(" · "))} &nbsp;|&nbsp; <code>${esc(D.repo)}</code></p>`,
  `<h2><small>The problem</small>One question, hundreds of conversations</h2>${stats(D.problem.stats)}
   <p class="note">Test histories hide near-miss conversations that look relevant but don't answer the question.</p>`,
  `<h2><small>Question types</small>Five ways to need memory</h2>
   <div class="types">${D.problem.types.map(([t, d]) => `<code>${esc(t)}</code><span>${esc(d)}</span>`).join("")}</div>`,
  `<h2><small>Architecture</small>Our code picks the evidence, Reactor answers</h2>${pipelineSvg(D.pipeline)}`,
  `<h2><small>Design decisions</small>Send the right few thousand characters</h2>${cards(D.design)}`,
  `<h2><small>Citations and abstention</small>Only cite what supports the answer</h2>${steps(D.citations)}
   <p class="note">${esc(D.citationNote)}<br>${esc(D.abstention)}</p>`,
  `<h2><small>Efficiency</small>A needle, not the haystack</h2>${stats(D.efficiency)}
   <p class="note">The baseline loads the whole history into Reactor: 65–125 messages per user.</p>`,
  `<h2><small>Results by question type</small>Retrieval on dev, the version used on test</h2>${pairSvg(D.byType, D.byTypeNames)}
   <p class="note">${esc(D.byTypeNote)}</p>`,
  `<h2><small>Results</small>Where we stand</h2>${barsSvg(D.results)}<p class="note">${esc(D.resultsNote)}</p>`,
  `<h2><small>v2 → v3</small>What the submission adds</h2>${cards(D.v2)}
   ${pairSvg(D.ablation.map(r => ({ label: r.label, a: r.before, b: r.after })), ["v2", "v3"], 1)}
   <p class="note">Answer in the evidence sent, v2 → v3. ${esc(D.v2Note)}</p>`,
  `<h2><small>Playing by the rules</small>Every answer is Reactor's</h2>${cards(D.rules)}`,
  `<h2><small>Run it</small>Reproduce, then see it live</h2><pre>${D.run.map(esc).join("\n")}</pre>`,
  `<h2><small>Next</small>What's next</h2>${steps(D.next)}`,
  `<h1>Thank you</h1><p class="sub">Questions?</p><p class="meta">${esc(D.team.join(" · "))}</p>`,
];

const deck = document.getElementById("deck");
deck.innerHTML = slides.map((s, i) => `<section id="s${i + 1}">${s}</section>`).join("");
const sections = [...deck.children];
const current = () => Math.round(deck.scrollTop / deck.clientHeight);
const go = i => sections[Math.max(0, Math.min(sections.length - 1, i))].scrollIntoView({ behavior: "smooth" });
const status = () => {
  const i = current();
  document.getElementById("nav").textContent = `${i + 1} / ${sections.length}`;
  document.getElementById("bar").style.width = `${(i + 1) / sections.length * 100}%`;
};
deck.addEventListener("scroll", status);
addEventListener("keydown", e => {
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(current() + 1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(current() - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(sections.length - 1);
});
status();
const reveal = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("in", e.isIntersecting)), { threshold: .5 });
sections.forEach(s => reveal.observe(s));

// WebGL background, rendered on the GPU: a drifting "haystack" of faint points, one gold "needle" that brightens
// as the deck advances. No WebGL, or reduced motion: the plain dark background stays.
(() => {
  const canvas = document.getElementById("gl"), gl = canvas.getContext("webgl");
  if (!gl) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frag = `precision mediump float;
    uniform vec2 res; uniform float t, progress;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main() {
      vec2 uv = gl_FragCoord.xy / res.y, c = vec2(res.x / res.y, 1.0);
      vec3 col = vec3(0.051, 0.067, 0.09);
      col += 0.05 * vec3(0.31, 0.71, 0.79) * smoothstep(1.4, 0.0, length(uv - vec2(0.15 * c.x, 0.9)));
      col += 0.05 * vec3(0.95, 0.64, 0.23) * smoothstep(1.4, 0.0, length(uv - vec2(0.9 * c.x, 0.1)));
      for (int layer = 0; layer < 3; layer++) {               // the haystack: three parallax layers of points
        float s = 18.0 + float(layer) * 14.0;
        vec2 p = uv * s + vec2(t * (0.02 + 0.015 * float(layer)), t * 0.01);
        vec2 id = floor(p), f = fract(p) - 0.5;
        vec2 o = vec2(hash(id), hash(id + 7.3)) - 0.5;
        float d = length(f - o * 0.7);
        float tw = 0.5 + 0.5 * sin(t * 1.5 + hash(id + 3.1) * 6.28);
        col += vec3(0.31, 0.71, 0.79) * smoothstep(0.06, 0.0, d) * 0.22 * tw / (1.0 + float(layer));
      }
      vec2 needle = vec2(c.x * (0.82 - 0.1 * progress), 0.72 + 0.03 * sin(t * 0.7));  // the needle
      float n = length(uv - needle);
      col += vec3(0.95, 0.64, 0.23) * (0.004 / (n * n + 0.002)) * (0.35 + 0.65 * progress) * 0.3;
      gl_FragColor = vec4(col, 1.0);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }"));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const u = name => gl.getUniformLocation(prog, name);
  let shown = 0;
  const frame = ms => {
    const dpr = Math.min(devicePixelRatio, 1.5), w = innerWidth * dpr | 0, h = innerHeight * dpr | 0;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    shown += (current() / (sections.length - 1) - shown) * 0.05;  // ease toward the current slide
    gl.uniform2f(u("res"), w, h); gl.uniform1f(u("t"), ms / 1000); gl.uniform1f(u("progress"), shown);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
